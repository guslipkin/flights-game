name: flights
description: "Flights: the airport-code shortest-route puzzle game from jotto-cli."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/flights.tsv
    - assets/coastlines.bin
    - assets/audio/jet_hop.wav
    - assets/audio/jet_back.wav
    - assets/audio/jet_longer.wav
    - assets/audio/jet_victory.wav

# App icons, generated from assets/icon/flights_icon.svg by
# scripts/render-icons.sh.
flutter_launcher_icons:
  image_path: assets/icon/flights_icon.png
  android: true
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: assets/icon/flights_icon_foreground.png
  # The foreground PNG is already scaled into the mask's safe zone by
  # scripts/render-icons.sh, so no extra inset (the default is 16%).
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/icon/flights_icon_macos.png
