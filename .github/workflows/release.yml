name: Release

# Pushing a version tag (v1.2.3) tests, builds all three apps and attaches them
# to that tag's GitHub release, creating the release if it doesn't exist yet
# (so notes written by hand before the builds finish are kept). Running it by
# hand from the Actions tab builds the apps as workflow artifacts only.
#
# Builds are unsigned: the APK uses Flutter's debug signing key, macOS shows a
# Gatekeeper warning on first open, and the iOS .ipa must be re-signed before
# it will install. Signing needs Apple/Android keys added as repo secrets.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build APK
        # The script prints separate flags, so splitting is intended.
        run: |
          # shellcheck disable=SC2046
          flutter build apk --release $(scripts/ci-build-args.sh)
      - run: mv build/app/outputs/flutter-apk/app-release.apk Flights-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Flights-android.apk

  # macOS and iOS share one job so the macOS runner (10x billing) only pays
  # for one checkout and Flutter setup.
  apple:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build macOS (Apple Silicon)
        # The script prints separate flags, so splitting is intended.
        run: |
          # shellcheck disable=SC2046
          flutter build macos --release $(scripts/ci-build-args.sh)
      - name: Build iOS / iPadOS (unsigned)
        # The script prints separate flags, so splitting is intended.
        run: |
          # shellcheck disable=SC2046
          flutter build ios --release --no-codesign $(scripts/ci-build-args.sh)
      - name: Package
        run: |
          ditto -c -k --keepParent build/macos/Build/Products/Release/Flights.app Flights-macos-arm64.zip
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Flights-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: |
            Flights-macos-arm64.zip
            Flights-ios-unsigned.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, apple]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" --clobber \
            Flights-android.apk Flights-macos-arm64.zip Flights-ios-unsigned.ipa
