name: Release

# Pushing a version tag (v1.2.3) tests, builds the Android, macOS and Windows
# apps and attaches them to that tag's GitHub release, creating the release if it doesn't exist yet
# (so notes written by hand before the builds finish are kept). Running it by
# hand from the Actions tab builds the apps as workflow artifacts only.
#
# The APK is signed with the release key from the repo secrets (see the
# README), so each release installs over the last. The macOS app has no
# Developer ID signature, so macOS blocks its first open until it's allowed
# in System Settings (see the README's Installing section). The Windows MSI
# is unsigned too, so SmartScreen warns on first run. There is no iOS build, because an
# unsigned .ipa can't be installed; that needs a paid Apple developer account
# and signing keys added as repo secrets.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Every release must be signed with the same key, or Android refuses to
      # install it over the last one. Fail rather than fall back to a debug key.
      - name: Load the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret isn't set; see the README's Android signing section."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # The script prints separate flags, so splitting is intended.
        run: |
          # shellcheck disable=SC2046
          flutter build apk --release $(scripts/ci-build-args.sh)
      - name: Show the signing certificate
        # The same fingerprint on every release means updates will install.
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep SHA-256
      - run: mv build/app/outputs/flutter-apk/app-release.apk Flights-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: Flights-android.apk

  macos:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build macOS (Apple Silicon)
        # The script prints separate flags, so splitting is intended.
        run: |
          # shellcheck disable=SC2046
          flutter build macos --release $(scripts/ci-build-args.sh)
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dmgbuild
        run: python -m pip install dmgbuild==2.0.0
      - name: Package as a disk image
        run: scripts/make-dmg.sh build/macos/Build/Products/Release/Flights.app Flights-macos.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: Flights-macos.dmg

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build Windows (x64)
        shell: bash
        # The script prints separate flags, so splitting is intended.
        run: |
          # shellcheck disable=SC2046
          flutter build windows --release $(scripts/ci-build-args.sh)
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Package as an MSI
        shell: pwsh
        # The version from the tag, as for the other builds; off a tag,
        # pubspec.yaml's.
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          }
          scripts/make-msi.ps1 -Version $version -Out Flights-windows.msi
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: Flights-windows.msi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Attach builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" --clobber \
            Flights-android.apk Flights-macos.dmg Flights-windows.msi
